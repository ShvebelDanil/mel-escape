<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Мэл: Побег из школы</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    height:100%; overflow:hidden; background:#10151b;
    font-family:'Segoe UI', 'Arial', system-ui, sans-serif;
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent;
    touch-action:none; overscroll-behavior:none;
  }
  #game { position:fixed; inset:0; }
  #game canvas { display:block; width:100%; height:100%; }

  .overlay {
    position:fixed; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px;
    z-index:10; padding:20px; text-align:center;
    background:rgba(10,20,16,0.55);
    -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px);
  }
  .overlay.hidden, .hidden { display:none !important; }
  .transparent-bg { background:transparent; -webkit-backdrop-filter:none; backdrop-filter:none; pointer-events:none; }

  h1.logo {
    font-size:clamp(34px, 9vw, 66px); line-height:1.04; font-weight:900;
    color:#ffd94a; letter-spacing:1px; text-transform:uppercase;
    text-shadow:0 3px 0 #7a4b00, 0 6px 14px rgba(0,0,0,0.6);
  }
  h1.logo span { display:block; color:#fff; font-size:0.62em; text-shadow:0 3px 0 #333, 0 6px 14px rgba(0,0,0,0.6); }
  .tagline { color:#cfe8d8; font-size:clamp(13px,3vw,17px); opacity:.9; margin-top:-6px; }

  .btn {
    appearance:none; border:none; cursor:pointer;
    font-family:inherit; font-weight:800; color:#3a2a00;
    background:linear-gradient(180deg,#ffe066,#ffb400);
    border-radius:16px; padding:16px 34px;
    font-size:clamp(18px,4.5vw,24px);
    box-shadow:0 5px 0 #b57e00, 0 10px 20px rgba(0,0,0,0.45);
    transition:transform .06s ease, box-shadow .06s ease;
    text-transform:uppercase; letter-spacing:.5px;
  }
  .btn:active { transform:translateY(4px); box-shadow:0 1px 0 #b57e00, 0 4px 10px rgba(0,0,0,0.45); }
  .btn.small { padding:10px 20px; font-size:15px; border-radius:12px; }
  .btn.ghost {
    background:rgba(255,255,255,0.12); color:#fff;
    box-shadow:0 4px 0 rgba(0,0,0,0.35); border:1px solid rgba(255,255,255,0.25);
  }
  .btn.ghost:active { box-shadow:0 1px 0 rgba(0,0,0,0.35); }
  .btn.ad { background:linear-gradient(180deg,#7ee081,#2fae4e); color:#06340f; box-shadow:0 5px 0 #1d7a36, 0 10px 20px rgba(0,0,0,0.45); }
  .btn.ad:active { box-shadow:0 1px 0 #1d7a36; }

  .stats-box {
    background:rgba(0,0,0,0.4); border:1px solid rgba(255,255,255,0.15);
    border-radius:18px; padding:14px 26px; display:flex; gap:26px; align-items:center;
  }
  .stat { display:flex; flex-direction:column; align-items:center; gap:2px; min-width:86px; }
  .stat .v { font-size:clamp(22px,5vw,30px); font-weight:900; color:#ffd94a; display:flex; align-items:center; gap:6px; }
  .stat .l { font-size:12px; color:#b8ccbe; text-transform:uppercase; letter-spacing:1px; }
  .stat .v img { height:1em; }

  .hint-row { display:flex; gap:18px; flex-wrap:wrap; justify-content:center; color:#dfe9df; font-size:clamp(12px,3vw,15px); }
  .hint-row b { background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.2); border-radius:8px; padding:2px 9px; margin-right:5px; }

  #loading { background:#15221a; z-index:50; }
  .spinner {
    width:54px; height:54px; border-radius:50%;
    border:6px solid rgba(255,217,74,0.25); border-top-color:#ffd94a;
    animation:spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
  #loading .lt { color:#cfe8d8; font-size:15px; }

  #hud { z-index:5; justify-content:flex-start; align-items:stretch; flex-direction:row;
    background:transparent; -webkit-backdrop-filter:none; backdrop-filter:none; pointer-events:none; }
  #hud > div { display:flex; align-items:center; gap:8px; }
  #hudScoreWrap { position:absolute; top:calc(10px + env(safe-area-inset-top)); left:calc(14px + env(safe-area-inset-left)); flex-direction:column !important; align-items:flex-start !important; }
  #score { font-size:clamp(26px,6vw,38px); font-weight:900; color:#fff; text-shadow:0 2px 0 rgba(0,0,0,0.5); }
  #score small { font-size:0.55em; font-weight:700; opacity:.85; }
  #hudRight { position:absolute; top:calc(10px + env(safe-area-inset-top)); right:calc(14px + env(safe-area-inset-right)); }
  #bottleCount {
    background:rgba(0,0,0,0.42); border:1px solid rgba(255,255,255,0.18);
    border-radius:14px; padding:6px 14px; color:#fff;
    font-size:clamp(17px,4.5vw,22px); font-weight:900; display:flex; align-items:center; gap:8px;
  }
  #bottleCount img { height:1.5em; }
  #pauseBtn {
    pointer-events:auto; cursor:pointer; appearance:none; border:1px solid rgba(255,255,255,0.25);
    background:rgba(0,0,0,0.42); color:#fff; border-radius:14px; width:46px; height:46px;
    font-size:18px; font-weight:900;
  }

  #flash { position:fixed; inset:0; z-index:8; pointer-events:none; opacity:0;
    box-shadow:inset 0 0 140px 40px rgba(220,30,30,0.85); }
  #flash.on { animation:flashAnim .5s ease-out; }
  @keyframes flashAnim { 0%{opacity:1;} 100%{opacity:0;} }

  #yell {
    position:fixed; top:26%; left:50%; transform:translateX(-50%); z-index:9;
    font-size:clamp(24px,7vw,44px); font-weight:900; color:#ff5252; white-space:nowrap;
    text-shadow:0 0 2px #fff, 0 3px 0 #5a0000, 0 6px 16px rgba(0,0,0,0.7);
    opacity:0; pointer-events:none;
  }
  #yell.on { animation:yellAnim 1.4s ease-out; }
  @keyframes yellAnim { 0%{opacity:0; transform:translateX(-50%) scale(.5);} 12%{opacity:1; transform:translateX(-50%) scale(1.15);} 22%{transform:translateX(-50%) scale(1);} 80%{opacity:1;} 100%{opacity:0;} }

  #hint {
    position:fixed; bottom:calc(18px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
    z-index:6; color:#eaf3ea; background:rgba(0,0,0,0.5); border-radius:14px; padding:10px 18px;
    font-size:clamp(12px,3.4vw,15px); pointer-events:none; opacity:0; transition:opacity .4s;
    display:flex; gap:16px; white-space:nowrap;
  }
  #hint.on { opacity:1; }

  .over-title { font-size:clamp(40px,11vw,72px); font-weight:900; color:#ff5252; text-transform:uppercase;
    text-shadow:0 3px 0 #4d0000, 0 8px 18px rgba(0,0,0,0.7); }
  .new-record { background:#ffd94a; color:#5a3d00; font-weight:900; padding:4px 14px; border-radius:10px;
    font-size:14px; text-transform:uppercase; letter-spacing:1px; animation:pulseNR 1s infinite alternate; }
  @keyframes pulseNR { from{transform:scale(1);} to{transform:scale(1.07);} }

  .corner-btns { position:absolute; top:calc(12px + env(safe-area-inset-top)); right:calc(12px + env(safe-area-inset-right)); display:flex; gap:8px; }
  .icon-btn { pointer-events:auto; cursor:pointer; width:44px; height:44px; border-radius:12px;
    border:1px solid rgba(255,255,255,0.25); background:rgba(0,0,0,0.4); color:#fff; font-size:20px; }

  #reviveBtn { display:flex; flex-direction:column; gap:2px; line-height:1.15; }
  #reviveBtn small { font-size:11px; font-weight:700; text-transform:none; letter-spacing:0; opacity:.85; }

  /* ===== Валюта и магазин ===== */
  .cur-badge {
    display:flex; align-items:center; gap:8px;
    background:rgba(0,0,0,0.45); border:1px solid rgba(255,255,255,0.18);
    border-radius:14px; padding:6px 14px; color:#fff;
    font-size:clamp(17px,4.5vw,22px); font-weight:900;
  }
  .cur-badge img { height:1.5em; }
  .menu-cur { position:absolute; top:calc(12px + env(safe-area-inset-top)); left:calc(12px + env(safe-area-inset-left)); }
  .btn.shop { background:linear-gradient(180deg,#b98bff,#7b3fe4); color:#fff; box-shadow:0 5px 0 #4f21a0, 0 10px 20px rgba(0,0,0,0.45); }
  .btn.shop:active { box-shadow:0 1px 0 #4f21a0, 0 4px 10px rgba(0,0,0,0.45); }

  #shop { justify-content:flex-end; gap:0; padding:0;
    background:transparent; -webkit-backdrop-filter:none; backdrop-filter:none; pointer-events:none; }
  #shop > * { pointer-events:auto; }
  #shopTop { position:absolute; top:calc(12px + env(safe-area-inset-top)); left:calc(12px + env(safe-area-inset-left));
    right:calc(12px + env(safe-area-inset-right)); display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .arrow-btn {
    position:absolute; top:46%; transform:translateY(-50%);
    width:clamp(48px,12vw,62px); height:clamp(48px,12vw,62px); border-radius:50%;
    appearance:none; cursor:pointer; border:1px solid rgba(255,255,255,0.3);
    background:rgba(0,0,0,0.45); color:#fff; font-size:clamp(22px,6vw,30px); font-weight:900;
    display:flex; align-items:center; justify-content:center;
  }
  .arrow-btn:active { transform:translateY(-50%) scale(0.94); }
  #skinPrevBtn { left:calc(14px + env(safe-area-inset-left)); }
  #skinNextBtn { right:calc(14px + env(safe-area-inset-right)); }

  #skinCard {
    width:min(430px, calc(100% - 28px));
    margin:0 auto calc(20px + env(safe-area-inset-bottom));
    background:rgba(8,16,26,0.82); border:1px solid rgba(255,255,255,0.16);
    border-radius:20px; padding:16px 20px 18px;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    box-shadow:0 10px 30px rgba(0,0,0,0.5);
  }
  #skinName { font-size:clamp(20px,5.5vw,27px); font-weight:900; color:#fff; letter-spacing:.5px; }
  #skinDesc { font-size:clamp(12px,3.2vw,14px); color:#b8ccbe; line-height:1.35; }
  #skinPrice { display:flex; align-items:center; gap:6px; font-size:clamp(16px,4.2vw,20px); font-weight:900;
    padding:4px 14px; border-radius:10px; }
  #skinPrice img { height:1.3em; }
  #skinPrice[data-state="free"] { color:#8ce39a; background:rgba(47,174,78,0.18); font-size:clamp(13px,3.4vw,15px); }
  #skinPrice[data-state="price"] { color:#ffd94a; background:rgba(255,217,74,0.12); }
  #skinPrice[data-state="locked"] { color:#ff8a8a; background:rgba(255,82,82,0.14); }

  #skinAction { appearance:none; border:none; cursor:pointer; font-family:inherit; font-weight:900;
    text-transform:uppercase; letter-spacing:.5px; border-radius:14px; padding:13px 40px;
    font-size:clamp(16px,4.2vw,20px); color:#fff; transition:transform .06s ease, box-shadow .06s ease; }
  #skinAction:active { transform:translateY(3px); }
  #skinAction[data-state="buy"] { background:linear-gradient(180deg,#7ee081,#2fae4e); color:#06340f; box-shadow:0 5px 0 #1d7a36; }
  #skinAction[data-state="buy"]:active { box-shadow:0 1px 0 #1d7a36; }
  #skinAction[data-state="locked"] { background:linear-gradient(180deg,#9aa2ab,#6f7780); color:#e8ebee; box-shadow:0 5px 0 #4c535a; opacity:.75; }
  #skinAction[data-state="locked"]:active { box-shadow:0 1px 0 #4c535a; }
  #skinAction[data-state="select"] { background:linear-gradient(180deg,#68b4ff,#2a7fe0); box-shadow:0 5px 0 #1a5aa5; }
  #skinAction[data-state="select"]:active { box-shadow:0 1px 0 #1a5aa5; }
  #skinAction[data-state="selected"] { background:linear-gradient(180deg,#7ee081,#2fae4e); color:#06340f; box-shadow:0 5px 0 #1d7a36; cursor:default; }

  #skinDots { display:flex; gap:7px; margin-top:2px; }
  #skinDots i { width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,0.28); }
  #skinDots i.on { background:#ffd94a; transform:scale(1.15); }

  #shopModal { position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center;
    padding:20px; background:rgba(4,8,12,0.68); -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px); }
  #shopModal .box {
    position:relative; width:min(390px,100%); text-align:center;
    background:#16232f; border:1px solid rgba(255,255,255,0.16); border-radius:20px;
    padding:26px 24px 22px; display:flex; flex-direction:column; align-items:center; gap:10px;
    box-shadow:0 18px 46px rgba(0,0,0,0.6);
  }
  #shopModal .box img { height:56px; }
  #shopModalClose { position:absolute; top:10px; right:12px; appearance:none; border:none; background:transparent;
    color:#8fa3b4; font-size:22px; font-weight:900; cursor:pointer; line-height:1; }
  #shopModalTitle { font-size:clamp(19px,5vw,25px); font-weight:900; color:#fff; }
  #shopModal[data-kind="ok"] #shopModalTitle { color:#8ce39a; }
  #shopModal[data-kind="err"] #shopModalTitle { color:#ff7b7b; }
  #shopModalText { font-size:clamp(13px,3.4vw,15px); color:#b8ccbe; line-height:1.4; }
  #shopModalBtn { margin-top:6px; }
  #shopModal[data-kind="err"] #shopModalBtn { background:linear-gradient(180deg,#9aa2ab,#6f7780); color:#fff; box-shadow:0 5px 0 #4c535a; }
</style>
</head>
<body>
<div id="game"></div>

<!-- HUD -->
<div id="hud" class="overlay hidden">
  <div id="hudScoreWrap">
    <div id="score">0 <small>м</small></div>
  </div>
  <div id="hudRight">
    <button id="pauseBtn" aria-label="Пауза">II</button>
    <div id="bottleCount"><img id="bottleIcon" alt="">×<span id="bottleNum">0</span></div>
  </div>
</div>
<div id="flash"></div>
<div id="yell"></div>
<div id="hint"></div>

<!-- Кнопка пропуска интро -->
<button id="skipIntroBtn" class="btn ghost small hidden" style="position:fixed; bottom:calc(20px + env(safe-area-inset-bottom)); right:calc(20px + env(safe-area-inset-right)); z-index:9;">Пропустить ⏭</button>

<!-- Loading -->
<div id="loading" class="overlay">
  <h1 class="logo">Мэл<span>Побег из школы</span></h1>
  <div class="spinner"></div>
  <div class="lt" id="loadingText">Загрузка…</div>
</div>

<!-- Menu -->
<div id="menu" class="overlay hidden">
  <div class="cur-badge menu-cur"><img id="menuCurIcon" alt=""><span id="menuCurrency">0</span></div>
  <div class="corner-btns">
    <button class="icon-btn" id="musicBtn" aria-label="Музыка">♪</button>
    <button class="icon-btn" id="soundBtn" aria-label="Звук">🔊</button>
  </div>
  <h1 class="logo">Мэл<span>Побег из школы</span></h1>
  <div class="tagline" id="menuTagline">Стяни дневник и убеги от злой учительницы!</div>
  <div class="stats-box">
    <div class="stat"><div class="v" id="menuBest">0</div><div class="l" id="menuBestLabel">Рекорд, м</div></div>
    <div class="stat"><div class="v"><img id="menuBottleIcon" alt=""><span id="menuBottles">0</span></div><div class="l" id="menuBottlesLabel">Всего собрано</div></div>
  </div>
  <button class="btn" id="playBtn">▶ Играть</button>
  <button class="btn shop" id="shopBtn">🛍 Магазин</button>
  <div class="hint-row">
    <span><b>←</b><b>→</b> полосы</span>
    <span><b>↑</b> прыжок</span>
    <span><b>↓</b> подкат</span>
    <span><b>свайпы</b> на телефоне</span>
  </div>
</div>

<!-- Pause -->
<div id="pause" class="overlay hidden">
  <h1 class="logo" style="font-size:clamp(28px,7vw,48px)">Пауза</h1>
  <button class="btn" id="resumeBtn">▶ Продолжить</button>
  <button class="btn ghost" id="restartBtn">🔄 Заново</button>
  <button class="btn ghost" id="pauseMenuBtn">🏠 В меню</button>
</div>

<!-- Game over -->
<div id="over" class="overlay hidden">
  <div class="over-title" id="overTitle">Попался!</div>
  <div class="new-record hidden" id="newRecord">🏆 Новый рекорд!</div>
  <div class="stats-box">
    <div class="stat"><div class="v" id="overScore">0</div><div class="l" id="overScoreLabel">Метров</div></div>
    <div class="stat"><div class="v"><img id="overBottleIcon" alt=""><span id="overBottles">0</span></div><div class="l" id="overBottlesLabel">Бутылок</div></div>
    <div class="stat"><div class="v" id="overBest">0</div><div class="l" id="overBestLabel">Рекорд</div></div>
  </div>
  <button class="btn" id="againBtn">▶ Ещё раз</button>
  <button class="btn ad hidden" id="reviveBtn"><span>📺 Второй шанс</span><small id="reviveHint">посмотри рекламу и беги дальше</small></button>
  <button class="btn ghost" id="overMenuBtn">🏠 В меню</button>
</div>

<!-- Shop -->
<div id="shop" class="overlay hidden">
  <div id="shopTop">
    <button class="btn ghost small" id="shopBackBtn">← Назад</button>
    <div class="cur-badge"><img id="shopCurIcon" alt=""><span id="shopCurrency">0</span></div>
  </div>
  <button class="arrow-btn" id="skinPrevBtn" aria-label="Предыдущий скин">❮</button>
  <button class="arrow-btn" id="skinNextBtn" aria-label="Следующий скин">❯</button>
  <div id="skinCard">
    <div id="skinName">—</div>
    <div id="skinDesc"></div>
    <div id="skinPrice" data-state="free"></div>
    <button id="skinAction" data-state="buy">Купить</button>
    <div id="skinDots"></div>
  </div>
</div>

<!-- Модалка магазина -->
<div id="shopModal" class="hidden" data-kind="ok">
  <div class="box">
    <button id="shopModalClose" aria-label="Закрыть">✕</button>
    <img id="shopModalIcon" alt="">
    <div id="shopModalTitle"></div>
    <div id="shopModalText"></div>
    <button class="btn small" id="shopModalBtn">Ок</button>
  </div>
</div>

<script src="https://sdk.games.s3.yandex.net/sdk.js"></script>
<!-- Подключаем библиотеку из новой папки lib -->
<script src="lib/three.min.js"></script>
<!-- Подключаем закодированные картинки из папки source (ДО загрузки игры!) -->
    <script src="source/assets.js"></script>
    
    <!-- ТЕПЕРЬ ПОДКЛЮЧАЕМ ГЛАВНЫЙ ФАЙЛ КАК МОДУЛЬ -->
    <script type="module" src="source/main.js"></script>
</body>
</html>
